[project]
name = "songscan"
version = "0.3.0"
description = "Read songs out of PDFs and images: chord charts as ChordPro, sheet music as MusicXML"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jared McKnight", email = "jmcknight@archertech.ca" },
]
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "chordpro-renderer",
    "pdfplumber",
    "pillow>=11",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/jnhmcknight/songscan"
Repository = "https://github.com/jnhmcknight/songscan"
Issues = "https://github.com/jnhmcknight/songscan/issues"

[project.optional-dependencies]
score = [
    "music21>=10.5.2",
    "svglib>=2.3.2",
    "verovio>=6.4.0",
]

[tool.uv.sources]
chordpro-renderer = { git = "https://github.com/jnhmcknight/chordpro.git", rev = "main" }

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pyright",
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=4.0.1",
    "pytest-timeout>=2.4.0",
    "reportlab>=4.0",
    "ruff",
    # The tests read sheet music too
    "songscan[score]",
]

[tool.pytest.ini_options]
timeout = 15
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=songscan --cov-report=term-missing"

[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "songscan"

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# As the Fanaux backend's: see its pyproject.toml
select = ["B", "C4", "FLY", "PERF", "PIE", "PLC0415", "RUF", "SIM", "T20", "TC004", "UP", "F401"]
ignore = ["C408", "PERF401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]
# The sheet music module (music21) is imported only when sheet music is read
"songscan/vision.py" = ["PLC0415"]

[tool.pyright]
include = ["songscan"]
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"
